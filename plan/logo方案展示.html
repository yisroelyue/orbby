<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbby · Logo 方案展示</title>
<style>
:root{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#292b30;background:#eeefed}*{box-sizing:border-box}body{margin:0;padding:36px 28px}header,main,footer{max-width:1420px;margin:auto}header{margin-bottom:30px}.eyebrow{font-size:10px;letter-spacing:3px;color:#878b83;font-weight:600}h1{font-size:26px;font-weight:600;letter-spacing:-.8px;margin:10px 0 8px}header p{font-size:12px;color:#7b7e77;line-height:1.8;margin:0}.group{margin:0 0 32px}.group-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #d9ddd4;padding:0 2px 10px;margin-bottom:14px}.group-head h2{font-size:13px;font-weight:600;margin:0;color:#41453f}.group-head span{font-size:10px;color:#92968e;letter-spacing:.5px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{margin:0;background:#fafbf9;border:1px solid #daddd8;border-radius:11px;padding:9px;box-shadow:0 10px 28px -22px #33352f70;overflow:hidden}.preview{display:block;width:100%;height:300px;object-fit:contain;background:#fff;border-radius:7px;cursor:zoom-in}.vector .preview{height:220px;padding:18px;background:linear-gradient(135deg,#f5f6f3,#fff)}figcaption{display:grid;gap:5px;padding:10px 3px 2px;font-size:11px;color:#51564e}.filename{font-family:ui-monospace,Consolas,monospace;font-size:9px;color:#8a8e86;overflow-wrap:anywhere}.foot{border-top:1px solid #d9ddd4;padding-top:13px;color:#92988b;font-size:10px;letter-spacing:1px}dialog{border:0;padding:0;background:transparent;max-width:96vw;max-height:94vh}dialog::backdrop{background:#171916e8}dialog img{display:block;max-width:94vw;max-height:88vh;object-fit:contain}dialog p{position:fixed;left:3vw;bottom:1vh;margin:0;color:#fff;font-size:11px}dialog button{position:fixed;right:3vw;bottom:1vh;border:0;background:transparent;color:#fff;font:inherit;font-size:12px;cursor:pointer}@media(max-width:900px){body{padding:26px 16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.preview{height:260px}}@media(max-width:520px){.grid{grid-template-columns:1fr}.preview{height:250px}.group{margin-bottom:26px}}
</style>
</head>
<body>
<header><div class="eyebrow">ORBBY / BRAND EXPLORATION / 2026.10</div><h1>Logo 方案展示</h1><p>图标方向与矢量稿汇总，按设计批次排列。点击图片可放大查看。</p></header>
<main>
<section class="group"><div class="group-head"><h2>01 / 图形探索 · 20 款方向</h2><span>CONCEPT STUDIES</span></div><div class="grid">
<figure class="card"><img class="preview" src="logo设计/app-icon-concepts-20-20261009-094623.png" alt="20 款应用图标概念，第一版" loading="lazy"><figcaption><span>图标概念 · 第一版</span><span class="filename">app-icon-concepts-20-20261009-094623.png</span></figcaption></figure>
<figure class="card"><img class="preview" src="logo设计/app-icon-concepts-20-20261009-095345.png" alt="20 款应用图标概念，第二版" loading="lazy"><figcaption><span>图标概念 · 第二版</span><span class="filename">app-icon-concepts-20-20261009-095345.png</span></figcaption></figure>
</div></section>
<section class="group"><div class="group-head"><h2>02 / 角色化方向</h2><span>AGENT INSPIRED</span></div><div class="grid">
<figure class="card"><img class="preview" src="logo设计/app-icon-concepts-agent-a-20261009-095648.png" alt="角色化应用图标概念" loading="lazy"><figcaption><span>角色化概念 · A</span><span class="filename">app-icon-concepts-agent-a-20261009-095648.png</span></figcaption></figure>
</div></section>
<section class="group"><div class="group-head"><h2>03 / 扁平图形方向</h2><span>FLAT STUDIES · A—C</span></div><div class="grid">
<figure class="card"><img class="preview" src="logo设计/app-icon-concepts-flat-a-20261009-100323.png" alt="扁平图形应用图标概念 A" loading="lazy"><figcaption><span>扁平图形 · A</span><span class="filename">app-icon-concepts-flat-a-20261009-100323.png</span></figcaption></figure>
<figure class="card"><img class="preview" src="logo设计/app-icon-concepts-flat-b-20261009-100249.png" alt="扁平图形应用图标概念 B" loading="lazy"><figcaption><span>扁平图形 · B</span><span class="filename">app-icon-concepts-flat-b-20261009-100249.png</span></figcaption></figure>
<figure class="card"><img class="preview" src="logo设计/app-icon-concepts-flat-c-20261009-100345.png" alt="扁平图形应用图标概念 C" loading="lazy"><figcaption><span>扁平图形 · C</span><span class="filename">app-icon-concepts-flat-c-20261009-100345.png</span></figcaption></figure>
</div></section>
<section class="group"><div class="group-head"><h2>04 / 扁平图形方向 · 第二组</h2><span>FLAT STUDIES 02 · A—C</span></div><div class="grid">
<figure class="card"><img class="preview" src="logo设计/app-icon-concepts-flat2-a-20261009-101157.png" alt="第二组扁平图形应用图标概念 A" loading="lazy"><figcaption><span>扁平图形 02 · A</span><span class="filename">app-icon-concepts-flat2-a-20261009-101157.png</span></figcaption></figure>
<figure class="card"><img class="preview" src="logo设计/app-icon-concepts-flat2-b-20261009-100733.png" alt="第二组扁平图形应用图标概念 B" loading="lazy"><figcaption><span>扁平图形 02 · B</span><span class="filename">app-icon-concepts-flat2-b-20261009-100733.png</span></figcaption></figure>
<figure class="card"><img class="preview" src="logo设计/app-icon-concepts-flat2-c-20261009-100750.png" alt="第二组扁平图形应用图标概念 C" loading="lazy"><figcaption><span>扁平图形 02 · C</span><span class="filename">app-icon-concepts-flat2-c-20261009-100750.png</span></figcaption></figure>
</div></section>
<section class="group"><div class="group-head"><h2>05 / 矢量稿</h2><span>SVG · SCALABLE</span></div><div class="grid">
<figure class="card vector"><img class="preview" src="logo设计/icon-shapes-01.svg" alt="Icon Shapes 01 矢量图标" loading="lazy"><figcaption><span>图形标志 · 原稿</span><span class="filename">icon-shapes-01.svg</span></figcaption></figure>
<figure class="card vector"><img class="preview" src="logo设计/icon-shapes-01-transparent-max.svg" alt="Icon Shapes 01 透明底矢量图标" loading="lazy"><figcaption><span>图形标志 · 透明底版本</span><span class="filename">icon-shapes-01-transparent-max.svg</span></figcaption></figure>
</div></section>
</main>
<footer class="foot">ORBBY — LOGO DESIGN ARCHIVE</footer>
<dialog id="viewer" aria-label="图片大图预览"><img alt=""><p></p><button type="button">关闭 · Esc</button></dialog>
<script>
const viewer=document.querySelector('#viewer'),large=viewer.querySelector('img'),caption=viewer.querySelector('p');
document.querySelectorAll('.preview').forEach(image=>image.addEventListener('click',()=>{large.src=image.src;large.alt=image.alt;caption.textContent=image.alt;viewer.showModal();}));
viewer.querySelector('button').addEventListener('click',()=>viewer.close());
viewer.addEventListener('click',event=>{if(event.target===viewer)viewer.close();});
</script>
</body>
</html>
